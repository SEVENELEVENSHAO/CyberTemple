<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吉利赋 - 浏览器游戏原型</title>
    <style>
      :root {
        --paper: #f2dfbd;
        --paper-deep: #d9b982;
        --ink: #1e1a16;
        --muted: #5d5147;
        --red: #b73a24;
        --red-deep: #7e241c;
        --gold: #c99a3d;
        --blue: #1f5c78;
        --shadow: rgba(18, 13, 10, 0.42);
        --panel: rgba(244, 225, 190, 0.86);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #17120f;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      }

      button,
      input {
        font: inherit;
      }

      .game {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        isolation: isolate;
      }

      .scene {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(90deg, rgba(22, 12, 9, 0.46), transparent 34%, rgba(22, 12, 9, 0.2)),
          var(--scene-image);
        background-size: cover;
        background-position: center;
        transform: scale(1.02);
        transition: opacity 500ms ease, transform 900ms ease;
      }

      .scene.zoomed {
        transform: scale(1.12);
      }

      .scene::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 54% 38%, rgba(248, 221, 165, 0.13), transparent 31%),
          linear-gradient(180deg, rgba(255, 241, 205, 0.1), rgba(43, 20, 16, 0.52));
        mix-blend-mode: screen;
      }

      .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.8;
      }

      .scene-prop {
        position: absolute;
        z-index: 1;
        pointer-events: none;
        display: none;
        transition: width 720ms cubic-bezier(.18,.83,.28,1), bottom 720ms cubic-bezier(.18,.83,.28,1), filter 720ms ease;
      }

      .scene-prop.visible {
        display: block;
      }

      .scene-prop.incense-burner {
        left: 50%;
        bottom: -5vh;
        width: min(47vw, 610px);
        transform: translateX(-50%);
        filter: drop-shadow(0 16px 18px rgba(28, 18, 12, 0.22));
      }

      .scene-prop.interactive {
        pointer-events: auto;
        cursor: pointer;
      }

      .scene-prop.incense-burner.zoomed {
        bottom: -16vh;
        width: min(105vw, 1280px);
        filter: drop-shadow(0 28px 28px rgba(28, 18, 12, 0.28));
      }

      .worship-control {
        position: absolute;
        left: 50%;
        bottom: 44vh;
        z-index: 5;
        width: 70px;
        height: 70px;
        padding: 0;
        border: 0;
        background: transparent;
        background-image: url("assets/praying-hands-icon.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        cursor: pointer;
        display: none;
        filter: drop-shadow(0 5px 5px rgba(30, 18, 12, 0.22));
        transform: translateX(-50%);
      }

      .worship-control.visible {
        display: block;
      }

      .worship-control:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .deity-worship-control {
        position: absolute;
        left: 50%;
        bottom: 28vh;
        z-index: 5;
        width: 70px;
        height: 70px;
        padding: 0;
        border: 0;
        background: transparent;
        background-image: url("assets/praying-hands-icon.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        cursor: pointer;
        display: none;
        filter: drop-shadow(0 5px 5px rgba(30, 18, 12, 0.22));
        transform: translateX(-50%);
      }

      .deity-worship-control.visible {
        display: block;
      }

      .deity-worship-control:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .guanyin-scroll {
        position: absolute;
        left: 50%;
        top: 18vh;
        z-index: 2;
        width: min(28.8vw, 342px);
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        display: none;
        transform: translateX(-50%);
        transform-origin: center center;
        filter: drop-shadow(0 14px 18px rgba(28, 16, 10, 0.22));
        transition: transform 900ms cubic-bezier(.24,.72,.22,1), filter 900ms ease;
      }

      .guanyin-scroll.visible {
        display: block;
      }

      .guanyin-scroll img {
        display: block;
        width: 100%;
        height: auto;
      }

      .guanyin-scroll.unowned img {
        opacity: 0.72;
        filter: saturate(0.72);
      }

      .guanyin-scroll.worship-focus {
        z-index: 5;
        transform: translateX(-50%) scale(2);
        filter: drop-shadow(0 24px 30px rgba(28, 16, 10, 0.28));
      }

      .guanyin-upgrade-hint {
        position: absolute;
        left: 50%;
        top: 100%;
        margin-top: 6px;
        min-width: 118px;
        color: #21170f;
        font-family: "STKaiti", "KaiTi", "FangSong", serif;
        font-size: 16px;
        line-height: 1.2;
        text-align: center;
        text-shadow: 0 1px 2px rgba(238, 219, 180, 0.7);
        transform: translateX(-50%);
      }

      .bow-hands {
        position: absolute;
        left: 50%;
        bottom: -8vh;
        z-index: 6;
        width: min(86vw, 920px);
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%) translateY(24vh) scale(.96);
        filter: drop-shadow(0 18px 22px rgba(25, 14, 9, 0.2));
      }

      .bow-hands.active {
        animation: deityBow 16.5s cubic-bezier(.38,0,.18,1) forwards;
      }

      .offering-hands {
        position: absolute;
        left: 50%;
        bottom: -10vh;
        z-index: 6;
        width: min(46vw, 430px);
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%) translateY(18vh);
        filter: drop-shadow(0 18px 20px rgba(25, 14, 9, 0.2));
      }

      .offering-hands.active {
        animation: bowOffering 8.4s cubic-bezier(.38,0,.18,1) forwards;
      }

      .placed-incense-layer {
        position: absolute;
        left: 50%;
        bottom: 21vh;
        z-index: 0;
        width: min(24vw, 250px);
        height: min(20vw, 210px);
        pointer-events: none;
        transform: translateX(-50%);
      }

      .placed-incense-layer.exterior {
        bottom: 13vh;
        transform: translateX(-50%) scale(0.48);
        transform-origin: bottom center;
      }

      .placed-incense {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(7vw, 72px);
        height: min(15vw, 155px);
        pointer-events: none;
        display: none;
        transform: translateX(-50%);
        filter: drop-shadow(0 7px 8px rgba(25, 14, 9, 0.18));
      }

      .placed-incense.visible {
        display: block;
      }

      .incense-clip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100%;
        overflow: hidden;
      }

      .incense-stick-image {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: min(15vw, 155px);
        object-fit: contain;
        object-position: bottom center;
      }

      .incense-flame {
        position: absolute;
        top: -7px;
        width: 10px;
        height: 14px;
        border-radius: 50% 50% 45% 45%;
        background: radial-gradient(circle at 50% 70%, #fff1a8 0 18%, #e57532 36%, rgba(169, 40, 22, 0.85) 58%, transparent 70%);
        filter: blur(0.2px) drop-shadow(0 0 7px rgba(232, 97, 39, 0.6));
        transform: translateX(-50%);
        animation: flameFlicker 520ms ease-in-out infinite alternate;
      }

      .incense-flame.left {
        left: 63%;
      }

      .incense-flame.center {
        left: 78%;
      }

      .incense-flame.right {
        left: 93%;
      }

      .incense-smoke {
        position: absolute;
        top: -24px;
        left: 0;
        right: 0;
        width: 100%;
        height: 70px;
        pointer-events: none;
      }

      .incense-smoke-layer {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .smoke-wisp {
        position: absolute;
        left: var(--x, 50%);
        top: var(--y, 50%);
        width: 3px;
        height: 88px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(252, 247, 235, 0), rgba(252, 247, 235, 0.42) 42%, rgba(252, 247, 235, 0.05) 100%);
        opacity: 0;
        transform-origin: bottom center;
        filter: blur(1.2px);
        animation: smokeWisp 4.2s ease-out forwards;
      }

      .smoke {
        position: absolute;
        inset: -15vh -10vw;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 19% 70%, rgba(230, 218, 187, 0.17), transparent 35%),
          radial-gradient(ellipse at 77% 24%, rgba(60, 120, 145, 0.16), transparent 28%),
          radial-gradient(ellipse at 48% 48%, rgba(214, 187, 142, 0.12), transparent 34%);
        filter: blur(22px);
        animation: drift 15s ease-in-out infinite alternate;
      }

      .mist-transition {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        opacity: 0;
      }

      .mist-transition::before,
      .mist-transition::after,
      .mist-layer::before,
      .mist-layer::after {
        content: "";
        position: absolute;
        top: -10%;
        bottom: -10%;
        width: 82%;
        background:
          radial-gradient(ellipse at 18% 30%, rgba(236, 226, 206, 0.88), transparent 38%),
          radial-gradient(ellipse at 46% 58%, rgba(217, 199, 170, 0.76), transparent 42%),
          radial-gradient(ellipse at 72% 42%, rgba(246, 237, 216, 0.7), transparent 35%),
          linear-gradient(90deg, rgba(239, 230, 211, 0.96), rgba(239, 230, 211, 0));
        filter: blur(18px);
      }

      .mist-transition::before {
        left: 0;
        transform: translateX(-105%);
      }

      .mist-transition::after {
        right: 0;
        transform: translateX(105%) scaleX(-1);
      }

      .mist-layer {
        position: absolute;
        inset: 0;
      }

      .mist-layer::before,
      .mist-layer::after {
        top: -18%;
        bottom: -18%;
        width: 72%;
        opacity: 0.72;
        filter: blur(30px);
      }

      .mist-layer::before {
        left: 0;
        transform: translateX(-112%) translateY(5%);
      }

      .mist-layer::after {
        right: 0;
        transform: translateX(112%) translateY(-4%) scaleX(-1);
      }

      .mist-transition.active {
        opacity: 1;
      }

      .mist-transition.active::before {
        animation: mistLeft 2.35s cubic-bezier(.18,.83,.28,1) forwards;
      }

      .mist-transition.active::after {
        animation: mistRight 2.28s cubic-bezier(.2,.75,.22,1) forwards;
      }

      .mist-transition.active .mist-layer::before {
        animation: mistLeftSoft 2.55s cubic-bezier(.12,.78,.24,1) forwards;
      }

      .mist-transition.active .mist-layer::after {
        animation: mistRightSoft 2.48s cubic-bezier(.15,.7,.26,1) forwards;
      }

      .hotspots {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .hotspot {
        position: absolute;
        display: grid;
        place-items: center;
        width: 64px;
        height: 74px;
        padding: 0;
        border: 0;
        color: #251a14;
        background: transparent;
        box-shadow: none;
        cursor: pointer;
        pointer-events: auto;
        transform: translate(-50%, -50%);
        transition: opacity 160ms ease, filter 160ms ease;
        animation: arrowFloat 1.8s ease-in-out infinite;
      }

      .hotspot::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("assets/buddha-hand-hotspot-lines.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        filter:
          sepia(0.35)
          saturate(0.8)
          contrast(1.08)
          drop-shadow(0 2px 0 rgba(242, 220, 181, 0.58));
      }

      .hotspot::after {
        content: "";
        position: absolute;
        inset: 8px 10px;
        border-radius: 50%;
        background: rgba(247, 218, 151, 0.14);
        filter: blur(10px);
        z-index: -1;
      }

      .hotspot:hover,
      .hotspot:focus-visible {
        opacity: 1;
        outline: none;
        filter: drop-shadow(0 0 10px rgba(247, 218, 151, 0.7));
      }

      .hotspot:disabled {
        cursor: default;
        opacity: 0.36;
      }

      .hotspot.moon-blocks {
        width: 110px;
        height: 77px;
        animation: none;
      }

      .hotspot.moon-blocks::before {
        background-image: url("assets/moon-blocks-custom.png");
        filter: drop-shadow(0 7px 6px rgba(20, 12, 8, 0.28));
      }

      .hotspot.moon-blocks::after {
        inset: auto 14px 2px;
        height: 18px;
        border-radius: 50%;
        background: rgba(30, 16, 10, 0.24);
        filter: blur(8px);
      }

      .hotspot.title-book {
        width: min(45vw, 540px);
        height: min(37vw, 410px);
        animation: bookFloat 3.2s ease-in-out infinite;
      }

      .hotspot.title-book::before {
        background-image: url("assets/title-book.png");
        filter: drop-shadow(0 28px 26px rgba(35, 12, 7, 0.42));
      }

      .hotspot.title-book::after {
        inset: auto 12% 2%;
        height: 34px;
        border-radius: 50%;
        background: rgba(55, 12, 6, 0.22);
        filter: blur(16px);
        z-index: -1;
      }

      .hud {
        position: relative;
        z-index: 4;
        display: grid;
        min-height: 100vh;
        grid-template-rows: auto 1fr auto;
        padding: 22px;
        gap: 16px;
        pointer-events: none;
      }

      .topbar,
      .ritual-bar,
      .journal {
        border: 0;
        background: var(--panel);
        box-shadow: 0 16px 40px var(--shadow);
        backdrop-filter: blur(10px);
        pointer-events: auto;
      }

      .topbar {
        justify-self: start;
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 54px;
        padding: 10px 14px;
      }

      .seal {
        display: grid;
        place-items: center;
        width: 38px;
        aspect-ratio: 1;
        background: var(--red);
        color: #ffe5bb;
        font-weight: 700;
        letter-spacing: 0;
        border: 0;
      }

      .title {
        display: grid;
        gap: 2px;
      }

      .title strong {
        font-size: 18px;
      }

      .title span,
      .meter span,
      .scene-name,
      .omen {
        color: var(--muted);
        font-size: 13px;
      }

      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 6px;
      }

      .fuyuan-value {
        min-width: 46px;
        color: #2a1b12;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .meter-track {
        width: 112px;
        height: 8px;
        background: rgba(76, 47, 30, 0.22);
        border: 0;
      }

      .meter-fill {
        width: 38%;
        height: 100%;
        background: linear-gradient(90deg, var(--red), var(--gold));
        transition: width 300ms ease;
      }

      .center-space {
        position: absolute;
        left: 34px;
        top: 118px;
        bottom: auto;
        z-index: 2;
        display: grid;
        gap: 14px;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 0;
        pointer-events: none;
      }

      .prompt {
        display: flex;
        flex-direction: row-reverse;
        gap: 14px;
        max-height: 100%;
        padding: 18px 12px;
        border: 0;
        color: #17120f;
        background:
          linear-gradient(180deg, rgba(244, 225, 190, 0.8), rgba(232, 205, 162, 0.58));
        box-shadow: 0 12px 30px rgba(27, 17, 12, 0.12);
        text-align: start;
        pointer-events: none;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "FangSong", "仿宋", serif;
        letter-spacing: 0;
        line-height: 1.85;
        text-shadow: 0 1px 0 rgba(244, 225, 190, 0.45);
        backdrop-filter: blur(2px);
      }

      .prompt strong {
        color: #17120f;
        font-size: 18px;
        font-weight: 500;
      }

      .prompt div {
        font-size: 18px;
      }

      .side-controls {
        position: static;
        z-index: auto;
        display: grid;
        gap: 12px;
        justify-items: center;
        justify-self: center;
        pointer-events: auto;
        padding-left: 0;
      }

      .round-button {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 999px;
        color: var(--ink);
        background: rgba(244, 225, 190, 0.86);
        box-shadow: 0 10px 24px rgba(27, 17, 12, 0.18);
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
      }

      #journalToggle {
        background: transparent;
        box-shadow: none;
      }

      .round-button:hover,
      .round-button:focus-visible {
        transform: translateY(-1px);
        background: rgba(255, 237, 199, 0.94);
        outline: none;
      }

      #journalToggle:hover,
      #journalToggle:focus-visible {
        background: transparent;
      }

      .round-button:disabled {
        opacity: 0.38;
        cursor: default;
        transform: none;
      }

      .scroll-icon {
        width: 64px;
        height: 64px;
        background-image: url("assets/journal-scroll-icon.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        filter: drop-shadow(0 2px 2px rgba(53, 31, 20, 0.22));
      }

      #backScene {
        font-size: 43px;
        font-weight: 800;
        line-height: 1;
        padding-bottom: 6px;
      }

      .ritual-bar {
        display: none;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .icon-button,
      .text-button {
        min-height: 40px;
        border: 0;
        color: var(--ink);
        background: rgba(255, 244, 217, 0.58);
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }

      .icon-button {
        width: 44px;
        font-size: 20px;
      }

      .text-button {
        padding: 0 14px;
      }

      .icon-button:hover,
      .text-button:hover,
      .icon-button:focus-visible,
      .text-button:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(183, 58, 36, 0.72);
        background: rgba(255, 231, 187, 0.92);
        outline: none;
      }

      .primary {
        background: var(--red);
        color: #ffe4ba;
        border-color: rgba(255, 220, 154, 0.5);
      }

      .wish {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        min-width: min(430px, 100%);
      }

      .wish input {
        min-width: 0;
        height: 40px;
        border: 0;
        background: rgba(255, 246, 224, 0.74);
        padding: 0 12px;
        color: var(--ink);
      }

      .journal {
        position: absolute;
        z-index: 5;
        top: 96px;
        right: 22px;
        width: min(330px, calc(100vw - 44px));
        padding: 16px;
        transform: translateX(0);
        transition: transform 260ms ease, opacity 260ms ease;
      }

      .journal[hidden] {
        display: block;
        pointer-events: none;
        opacity: 0;
        transform: translateX(24px);
      }

      .journal h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .journal dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 12px;
        margin: 0;
        font-size: 14px;
      }

      .journal dt {
        color: var(--red-deep);
      }

      .journal dd {
        margin: 0;
      }

      .omen {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid rgba(84, 55, 36, 0.22);
        line-height: 1.55;
      }

      .flash {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(circle at 50% 52%, rgba(255, 212, 107, 0.72), transparent 35%);
        opacity: 0;
      }

      .flash.active {
        animation: blessing 700ms ease;
      }

      .moon-result-panel {
        position: absolute;
        left: 50%;
        top: 42%;
        z-index: 5;
        width: min(40vw, 520px);
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) translateY(18px) scale(.94);
        display: none;
      }

      .moon-result-panel.active {
        display: block;
        animation: moonPanelEnter 4.8s cubic-bezier(.24,.72,.22,1) forwards;
      }

      .moon-result-sign {
        margin-bottom: 4px;
        color: #16110c;
        font-family: "STXingkai", "STKaiti", "KaiTi", "FangSong", serif;
        font-size: clamp(54px, 7vw, 108px);
        font-weight: 900;
        line-height: 1;
        text-align: center;
        letter-spacing: 0;
        text-shadow:
          0 2px 0 rgba(141, 38, 21, 0.14),
          0 10px 18px rgba(30, 16, 8, 0.22);
        opacity: 0;
      }

      .moon-result-panel.active .moon-result-sign {
        animation: moonSignReveal 3s cubic-bezier(.24,.72,.22,1) forwards;
      }

      .moon-result-image {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 12px 12px rgba(45, 18, 10, 0.16));
      }

      .moon-result-panel.active .moon-result-image {
        animation: moonBlockCast 1.1s ease-out both;
      }

      .moon-result-text {
        margin-top: 8px;
        color: #21170f;
        font-family: "STKaiti", "KaiTi", "FangSong", serif;
        font-size: clamp(18px, 1.6vw, 24px);
        line-height: 1.45;
        text-align: center;
        letter-spacing: 0;
        text-shadow: 0 1px 2px rgba(238, 219, 180, 0.62);
      }

      @keyframes drift {
        from {
          transform: translate3d(-2vw, 1vh, 0) scale(1);
        }
        to {
          transform: translate3d(2vw, -1vh, 0) scale(1.04);
        }
      }

      @keyframes blessing {
        0% { opacity: 0; }
        22% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes moonPanelEnter {
        0% { opacity: 0; transform: translate(-50%, -50%) translateY(18px) scale(.94); }
        15% { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(1); }
        82% { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) translateY(8px) scale(.985); }
      }

      @keyframes moonBlockCast {
        0% { opacity: 0; transform: translateY(8px) scale(.985); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes moonSignReveal {
        0% { opacity: 0; transform: translateY(34px) scale(.42); filter: blur(4px); }
        16% { opacity: 1; transform: translateY(-8px) scale(1.12); filter: blur(0); }
        30% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        70% { opacity: 1; transform: translateY(0) scale(1.04); filter: blur(0); }
        100% { opacity: 0; transform: translateY(-18px) scale(1.55); filter: blur(2px); }
      }

      @keyframes arrowFloat {
        0%, 100% {
          transform: translate(-50%, -50%);
        }
        50% {
          transform: translate(-50%, calc(-50% - 10px));
        }
      }

      @keyframes bookFloat {
        0%, 100% {
          transform: translate(-50%, -50%) rotate(-1deg);
        }
        50% {
          transform: translate(-50%, calc(-50% - 14px)) rotate(1deg);
        }
      }

      @keyframes bowOffering {
        0% { opacity: 0; transform: translateX(-50%) translateY(22vh) scale(.94); }
        9% { opacity: 1; transform: translateX(-50%) translateY(3vh) scale(1); }
        22% { transform: translateX(-50%) translateY(-16vh) scale(1.025); }
        35% { transform: translateX(-50%) translateY(7vh) scale(.99); }
        48% { transform: translateX(-50%) translateY(-16vh) scale(1.025); }
        61% { transform: translateX(-50%) translateY(7vh) scale(.99); }
        74% { transform: translateX(-50%) translateY(-16vh) scale(1.025); }
        88% { opacity: 1; transform: translateX(-50%) translateY(2vh) scale(1); }
        100% { opacity: 0; transform: translateX(-50%) translateY(18vh) scale(.96); }
      }

      @keyframes deityBow {
        0% { opacity: 0; transform: translateX(-50%) translateY(24vh) scale(.96); }
        9% { opacity: 1; transform: translateX(-50%) translateY(5vh) scale(1); }
        22% { transform: translateX(-50%) translateY(-24vh) scale(1.025); }
        35% { transform: translateX(-50%) translateY(10vh) scale(.995); }
        48% { transform: translateX(-50%) translateY(-24vh) scale(1.025); }
        61% { transform: translateX(-50%) translateY(10vh) scale(.995); }
        74% { transform: translateX(-50%) translateY(-24vh) scale(1.025); }
        88% { opacity: 1; transform: translateX(-50%) translateY(2vh) scale(1); }
        100% { opacity: 1; transform: translateX(-50%) translateY(2vh) scale(1); }
      }

      @keyframes flameFlicker {
        from {
          transform: translateX(-50%) scale(0.86, 1.05) rotate(-2deg);
          opacity: 0.82;
        }
        to {
          transform: translateX(-50%) scale(1.08, 0.92) rotate(3deg);
          opacity: 1;
        }
      }

      @keyframes smokeWisp {
        0% {
          opacity: 0;
          transform: translate(-50%, 0) scaleY(0.55);
        }
        16% {
          opacity: 0.4;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -110px) scaleY(1.45);
        }
      }

      @keyframes mistLeft {
        0% { transform: translateX(-108%) translateY(0); }
        24% { transform: translateX(-32%) translateY(-2%); }
        44% { transform: translateX(-8%) translateY(1%); }
        58% { transform: translateX(-6%) translateY(-1%); }
        70% { transform: translateX(-12%) translateY(.5%); }
        86% { transform: translateX(-58%) translateY(-1.5%); }
        100% { transform: translateX(-115%) translateY(0); }
      }

      @keyframes mistRight {
        0% { transform: translateX(108%) translateY(0) scaleX(-1); }
        27% { transform: translateX(32%) translateY(2%) scaleX(-1); }
        47% { transform: translateX(8%) translateY(-1%) scaleX(-1); }
        60% { transform: translateX(6%) translateY(1%) scaleX(-1); }
        72% { transform: translateX(13%) translateY(-.5%) scaleX(-1); }
        88% { transform: translateX(60%) translateY(1.5%) scaleX(-1); }
        100% { transform: translateX(115%) translateY(0) scaleX(-1); }
      }

      @keyframes mistLeftSoft {
        0% { transform: translateX(-116%) translateY(5%); opacity: .48; }
        30% { transform: translateX(-30%) translateY(1%); opacity: .82; }
        52% { transform: translateX(-7%) translateY(-3%); opacity: .9; }
        67% { transform: translateX(-10%) translateY(-1%); opacity: .78; }
        84% { transform: translateX(-52%) translateY(4%); opacity: .54; }
        100% { transform: translateX(-120%) translateY(6%); opacity: .35; }
      }

      @keyframes mistRightSoft {
        0% { transform: translateX(116%) translateY(-4%) scaleX(-1); opacity: .44; }
        29% { transform: translateX(30%) translateY(-1%) scaleX(-1); opacity: .8; }
        50% { transform: translateX(7%) translateY(3%) scaleX(-1); opacity: .88; }
        66% { transform: translateX(10%) translateY(1%) scaleX(-1); opacity: .76; }
        83% { transform: translateX(53%) translateY(-4%) scaleX(-1); opacity: .52; }
        100% { transform: translateX(120%) translateY(-6%) scaleX(-1); opacity: .34; }
      }

      @media (max-width: 820px) {
        .scene {
          background-size: auto 100%;
          background-position: center center;
        }

        .hotspot.title-book {
          width: min(82vw, 430px);
          height: min(68vw, 356px);
        }

        .hotspot.moon-blocks {
          width: 88px;
          height: 62px;
        }

        .scene-prop.incense-burner {
          bottom: -7vh;
          width: min(92vw, 520px);
        }

        .scene-prop.incense-burner.zoomed {
          bottom: -10vh;
          width: min(152vw, 860px);
        }

        .worship-control {
          bottom: 38vh;
          width: 64px;
          height: 64px;
        }

        .deity-worship-control {
          bottom: 31vh;
          width: 64px;
          height: 64px;
        }

        .placed-incense-layer {
          bottom: 18vh;
          width: min(46vw, 190px);
          height: min(39vw, 162px);
        }

        .placed-incense-layer.exterior {
          bottom: 11vh;
          transform: translateX(-50%) scale(0.58);
        }

        .placed-incense {
          width: min(14vw, 54px);
          height: min(30vw, 118px);
        }

        .incense-stick-image {
          height: min(30vw, 118px);
        }

        .guanyin-scroll {
          top: 25vh;
          width: min(56vw, 290px);
        }

        .guanyin-scroll.worship-focus {
          transform: translateX(-50%) scale(1.55);
        }

        .guanyin-upgrade-hint {
          font-size: 14px;
        }

        .moon-result-panel {
          top: 44%;
          width: min(78vw, 420px);
        }

        .moon-result-sign {
          font-size: clamp(48px, 15vw, 82px);
        }

        .bow-hands {
          bottom: -3vh;
          width: min(132vw, 690px);
        }

        .offering-hands {
          bottom: -5vh;
          width: min(78vw, 360px);
        }

        .hud {
          padding: 12px;
        }

        .topbar {
          width: 100%;
        }

        .ritual-bar {
          grid-template-columns: 1fr;
        }

        .wish {
          min-width: 100%;
        }

        .center-space {
          left: 14px;

        }

        .prompt {
          padding: 10px 4px;
          line-height: 1.65;
        }

        .prompt strong {
          font-size: 16px;

          font-size: 16px;
        }

        }

      @media (max-width: 520px) and (orientation: portrait) {
        .scene {
          background-size: auto 108%;
        }

          width: 108vw;
        }

        .scene-prop.incense-burner.zoomed {
          bottom: -8vh;
          width: 174vw;
        }

        .worship-control {
          bottom: 36vh;
        }

          bottom: 16vh;
          width: 54vw;
          height: 45vw;
        }

        .placed-incense-layer.exterior {

          transform: translateX(-50%) scale(0.62);
        }

          width: min(68vw, 280px);
        }

        }

        }

        }

        .prompt strong,
        .prompt div {
          font-size: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="game" aria-label="吉利赋浏览器游戏原型">
      <div class="scene" id="scene"></div>
      <img class="scene-prop incense-burner" id="incenseBurnerProp" src="assets/exterior-incense-burner.png" alt="" />
      <div class="placed-incense-layer" id="placedIncenseLayer" aria-hidden="true"></div>
      <div class="incense-smoke-layer" id="incenseSmokeLayer" aria-hidden="true"></div>
      <img class="offering-hands" id="offeringHands" src="assets/offering-hands.png" alt="" />
      <img class="bow-hands" id="bowHands" src="assets/bow-hands.png" alt="" />
      <button class="worship-control" id="worshipButton" title="上香礼拜" aria-label="上香礼拜"></button>
      <button class="deity-worship-control" id="deityWorshipButton" title="祭拜神像" aria-label="祭拜神像"></button>
      <button class="guanyin-scroll" id="guanyinScrollButton" title="供奉升级观音像" aria-label="供奉升级观音像">
        <img id="guanyinScrollImage" src="assets/guanyin-level-1.png" alt="" />
        <span class="guanyin-upgrade-hint" id="guanyinUpgradeHint"></span>
      </button>
      <div class="smoke" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="moon-result-panel" id="moonResultPanel" aria-live="polite">
        <div class="moon-result-sign" id="moonResultSign"></div>
        <img class="moon-result-image" id="moonResultImage" src="assets/moon-result-sheng.png" alt="" />
        <div class="moon-result-text" id="moonResultText"></div>
      </div>
      <div class="mist-transition" id="mistTransition" aria-hidden="true"><div class="mist-layer"></div></div>
      <div class="hotspots" id="hotspots" aria-label="场景交互区域"></div>
      <div class="center-space">
        <div class="prompt" role="status" aria-live="polite">
          <strong id="promptTitle">山门半开。</strong>
          <div id="promptText">暖风卷着香灰，从门缝里轻轻吹来。</div>
        </div>
        <div class="side-controls" aria-label="侧边操作">
          <button class="round-button" id="journalToggle" title="打开记录册" aria-label="打开记录册">
            <span class="scroll-icon" aria-hidden="true"></span>
          </button>
          <button class="round-button" id="backScene" title="返回" aria-label="返回">‹</button>
        </div>
      </div>
      <audio id="bgAudio" src="assets/sounds/shanmen-bg.mp3" loop preload="auto"></audio>
      <audio id="chantAudio" src="assets/sounds/chant-main-hall.mp3" preload="auto"></audio>
      <audio id="singingBowlAudio" src="assets/sounds/singing-bowl.mp3" preload="auto"></audio>
      <audio id="titleBambooAudio" src="assets/sounds/title-bamboo.mp3" preload="auto"></audio>
      <audio id="titleReturnAudio" src="assets/sounds/title-return-bg.mp3" loop preload="auto"></audio>

      <section class="hud">
        <header class="topbar">
          <div class="seal" aria-hidden="true">吉</div>
          <div class="title">
            <strong>吉利赋</strong>
            <span id="sceneName">山门入口</span>
          </div>
          <div class="meter" aria-label="福缘值">
            <span>福缘</span>
            <strong class="fuyuan-value" id="fuyuanValue">500</strong>
            <div class="meter-track"><div class="meter-fill" id="meter"></div></div>
          </div>
        </header>

        <div></div>

        <footer class="ritual-bar"></footer>
      </section>

      <aside class="journal" id="journal" hidden>
        <h2>庙中记</h2>
        <dl>
          <dt>入庙</dt>
          <dd>第一夜</dd>
          <dt>神像</dt>
          <dd id="statueLevel">旧泥像</dd>
          <dt>愿望</dt>
          <dd id="wishType">未言明</dd>
          <dt>兆象</dt>
          <dd id="signType">待显</dd>
        </dl>
        <div class="omen" id="omenText">
          古册第一页写着：念一遍，入一回。庙记得安静的手势，也记得未说出口的心愿。
        </div>
      </aside>
    </main>

    <script>
      const scenes = [
        {
          id: "title",
          name: "吉利赋",
          image: "assets/title-wall.png",
          title: "古册悬于红墙之前。",
          text: "点击古册，念咒入山门。",
          hotspots: [
            { label: "进入山门", target: "gate", variant: "title-book", transition: "mist", x: 52, y: 50 }
          ]
        },
        {
          id: "book",
          name: "古册 / 第一咒",
          image: "assets/generated-book-clouds.svg",
          title: "墨云从第一页上浮起。",
          text: "点击摊开的书页，念出第一句咒。",
          hotspots: [
            { label: "念咒", target: "gate", x: 50, y: 62 }
          ]
        },
        {
          id: "gate",
          name: "山门",
          image: "assets/gate-custom.png",
          title: "山门半开。",
          text: "点击门洞，走进只属于你的古寺。",
          hotspots: [
            { label: "入山门", target: "courtyard", x: 50, y: 61 }
          ]
        },
        {
          id: "courtyard",
          name: "主殿门前",
          image: "assets/main-hall-exterior-custom.png",
          title: "主殿在石阶尽头静候。",
          text: "点击中央门洞，进入庙堂。",
          prop: "incenseBurner",
          hotspots: [
            { label: "入主殿", target: "mainHall", x: 50, y: 56 }
          ]
        },
        {
          id: "incenseBurnerClose",
          name: "香炉近前",
          image: "assets/main-hall-exterior-custom.png",
          title: "香炉近在眼前。",
          text: "铜色纹路里沉着旧香灰。",
          prop: "incenseBurnerClose",
          hotspots: []
        },
        {
          id: "bellPond",
          name: "铜钟池",
          image: "assets/generated-bell-pond.svg",
          title: "铜钟立在钱池后方。",
          text: "点击铜钟投币，或使用下方投币仪式。",
          hotspots: [
            { label: "投币", ritual: "coin", x: 50, y: 57 }
          ]
        },
        {
          id: "mainHall",
          name: "主殿",
          image: "assets/main-hall-custom.png",
          title: "庙堂里很静。",
          text: "点击供桌上的圣杯，或在下方写下愿望。",
          hotspots: [
            { label: "掷圣杯", ritual: "blocks", variant: "moon-blocks", x: 59, y: 86 }
          ]
        }
      ];

      const omens = {
        finance: "供碗旁浮出一枚朱印。财路可开，但须先修一段旧路。",
        health: "香烟向东墙弯去。灰烬里映出一座药师小殿。",
        love: "两盏灯明灭不一。此愿并非不允，只是还要等一等。",
        study: "青色云纹掠过梁上，一枚文昌符从案边轻轻落下。",
        family: "铜钟低低回应一声。庙中将此愿记为护佑。",
        default: "圣杯缓缓停下。庙已经听见，只是尚未指出门路。"
      };

      let currentSceneId = "title";
      const sceneHistory = [];
      let fate = 500;
      let statue = 0;
      let typingTimer = 0;
      let chantSessionActive = false;
      let chantWasInMainHall = false;
      let chantUnlocked = false;
      let chantRetryPending = false;
      let hasLeftTitle = false;
      let incenseCount = 0;
      let titleAudioFadeFrame = 0;
      let bgAudioFadeFrame = 0;
      let chantAudioFadeFrame = 0;
      let deityWorshipActive = false;
      let bowlDuckingActive = false;
      let bowMotionDone = false;
      let bowHideTimeReached = false;
      let moonBlockBusy = false;
      let chantRestoreTimer = 0;
      let bowHideTimer = 0;
      let moonResultTimer = 0;
      const burningIncense = [];
      const incenseBurnDuration = 10 * 60 * 1000;
      let incenseBurnLoopStarted = false;
      const guanyinCosts = [0, 500, 1000, 1500, 2000];
      const guanyinImages = [
        "",
        "assets/guanyin-level-1.png",
        "assets/guanyin-level-2.png",
        "assets/guanyin-level-3.png",
        "assets/guanyin-level-4.png"
      ];

      const sceneEl = document.getElementById("scene");
      const hotspotsEl = document.getElementById("hotspots");
      const sceneName = document.getElementById("sceneName");
      const incenseBurnerProp = document.getElementById("incenseBurnerProp");
      const placedIncenseLayer = document.getElementById("placedIncenseLayer");
      const incenseSmokeLayer = document.getElementById("incenseSmokeLayer");
      const offeringHands = document.getElementById("offeringHands");
      const bowHands = document.getElementById("bowHands");
      const worshipButton = document.getElementById("worshipButton");
      const deityWorshipButton = document.getElementById("deityWorshipButton");
      const guanyinScrollButton = document.getElementById("guanyinScrollButton");
      const guanyinScrollImage = document.getElementById("guanyinScrollImage");
      const guanyinUpgradeHint = document.getElementById("guanyinUpgradeHint");
      const promptTitle = document.getElementById("promptTitle");
      const promptText = document.getElementById("promptText");
      const meter = document.getElementById("meter");
      const fuyuanValue = document.getElementById("fuyuanValue");
      const flash = document.getElementById("flash");
      const moonResultPanel = document.getElementById("moonResultPanel");
      const moonResultSign = document.getElementById("moonResultSign");
      const moonResultImage = document.getElementById("moonResultImage");
      const moonResultText = document.getElementById("moonResultText");
      const mistTransition = document.getElementById("mistTransition");
      const journal = document.getElementById("journal");
      const wishInput = document.getElementById("wishInput");
      const wishType = document.getElementById("wishType");
      const signType = document.getElementById("signType");
      const omenText = document.getElementById("omenText");
      const statueLevel = document.getElementById("statueLevel");

      function getScene(id) {
        return scenes.find((scene) => scene.id === id) || scenes[0];
      }

      function renderScene() {
        const scene = getScene(currentSceneId);
        sceneEl.style.setProperty("--scene-image", `url("${scene.image}")`);
        sceneEl.classList.toggle("zoomed", scene.prop === "incenseBurnerClose");
        sceneName.textContent = scene.name;
        typePrompt(scene.title, scene.text);
        incenseBurnerProp.classList.toggle("visible", scene.prop === "incenseBurner" || scene.prop === "incenseBurnerClose");
        incenseBurnerProp.classList.toggle("interactive", scene.prop === "incenseBurner");
        incenseBurnerProp.classList.toggle("zoomed", scene.prop === "incenseBurnerClose");
        worshipButton.classList.toggle("visible", scene.prop === "incenseBurnerClose");
        worshipButton.disabled = scene.prop !== "incenseBurnerClose";
        deityWorshipButton.classList.toggle("visible", scene.id === "mainHall" && !deityWorshipActive);
        deityWorshipButton.disabled = scene.id !== "mainHall" || deityWorshipActive;
        guanyinScrollButton.classList.toggle("visible", scene.id === "mainHall");
        const showIncenseLayer = scene.prop === "incenseBurnerClose" || scene.prop === "incenseBurner";
        placedIncenseLayer.style.display = showIncenseLayer ? "block" : "none";
        placedIncenseLayer.classList.toggle("exterior", scene.prop === "incenseBurner");
        hotspotsEl.replaceChildren();
        scene.hotspots.forEach((hotspot) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = hotspot.variant ? `hotspot ${hotspot.variant}` : "hotspot";
          button.setAttribute("aria-label", hotspot.label);
          button.title = hotspot.label;
          button.style.left = `${hotspot.x}%`;
          button.style.top = `${hotspot.y}%`;
          button.addEventListener("click", () => {
            if (hotspot.target) {
              goToScene(hotspot.target, hotspot.transition);
            }
            if (hotspot.ritual) {
              performRitual(hotspot.ritual);
            }
          });
          hotspotsEl.append(button);
        });
        document.getElementById("backScene").disabled = sceneHistory.length === 0;
        updateFuyuanUI();
        updateAllAudio();
      }

      function goToScene(targetId, transition) {
        if (targetId === currentSceneId) return;
        if (transition === "mist") {
          playMistTransition(targetId);
          return;
        }
        if (currentSceneId === "title") hasLeftTitle = true;
        sceneHistory.push(currentSceneId);
        currentSceneId = targetId;
        renderScene();
      }

      function playMistTransition(targetId, pushHistory = true) {
        if (!mistTransition) return;
        hotspotsEl.style.pointerEvents = "none";
        mistTransition.classList.remove("active");
        void mistTransition.offsetWidth;
        mistTransition.classList.add("active");
        window.setTimeout(() => {
          if (currentSceneId === "title") hasLeftTitle = true;
          if (pushHistory) sceneHistory.push(currentSceneId);
          currentSceneId = targetId;
          renderScene();
        }, 1140);
        window.setTimeout(() => {
          mistTransition.classList.remove("active");
          hotspotsEl.style.pointerEvents = "";
        }, 2620);
      }

      function goBack() {
        const previousSceneId = sceneHistory.pop();
        if (!previousSceneId) return;
        if (currentSceneId === "gate" && previousSceneId === "title") {
          playMistTransition(previousSceneId, false);
          return;
        }
        currentSceneId = previousSceneId;
        renderScene();
      }

      function addFate(amount) {
        fate = Math.max(0, fate + amount);
        updateFuyuanUI();
      }

      function updateFuyuanUI() {
        fuyuanValue.textContent = fate;
        meter.style.width = `${Math.min(100, (fate / 2000) * 100)}%`;
        statueLevel.textContent = statue > 0 ? `观音像${statue}级` : "未供奉";
        updateGuanyinDisplay();
      }

      function updateGuanyinDisplay() {
        const displayLevel = statue > 0 ? statue : 1;
        guanyinScrollImage.src = guanyinImages[displayLevel];
        guanyinScrollImage.alt = statue > 0 ? `观音像${statue}级` : "待供奉观音像";
        guanyinScrollButton.classList.toggle("unowned", statue === 0);
        if (statue >= 4) {
          guanyinUpgradeHint.textContent = "四级圆满";
          return;
        }
        const nextLevel = statue + 1;
        guanyinUpgradeHint.textContent = `${nextLevel}级 ${guanyinCosts[nextLevel]}福缘`;
      }

      function bless(title, text, sign, amount = 6) {
        typePrompt(title, text);
        signType.textContent = sign;
        omenText.textContent = text;
        if (amount) addFate(amount);
        flash.classList.remove("active");
        void flash.offsetWidth;
        flash.classList.add("active");
      }

      function typePrompt(title, text) {
        clearTimeout(typingTimer);
        promptTitle.textContent = "";
        promptText.textContent = "";
        const titleChars = [...title];
        const textChars = [...text];
        let index = 0;

        function tick() {
          if (index < titleChars.length) {
            promptTitle.textContent += titleChars[index];
          } else {
            const textIndex = index - titleChars.length;
            if (textIndex < textChars.length) {
              promptText.textContent += textChars[textIndex];
            } else {
              return;
            }
          }
          index += 1;
          typingTimer = setTimeout(tick, 46);
        }

        tick();
      }

      function startBackgroundAudio() {
        const audio = document.getElementById("bgAudio");
        if (!audio) return;
        if (currentSceneId === "title") {
          audio.pause();
          return;
        }
        if (!audio.dataset.started) {
          audio.volume = 0;
          audio.dataset.started = "true";
        }
        audio.play().catch(() => {});
        fadeAudio(audio, 0.42, 1700, "bg");
      }

      function updateAllAudio() {
        if (currentSceneId === "title") {
          stopGameAudio();
          startTitleAudio();
          return;
        }
        stopTitleAudio();
        startBackgroundAudio();
        updateChantAudio();
      }

      function stopGameAudio() {
        const bgAudio = document.getElementById("bgAudio");
        const chantAudio = document.getElementById("chantAudio");
        const bowlAudio = document.getElementById("singingBowlAudio");
        if (bgAudio) bgAudio.pause();
        if (chantAudio) {
          chantAudio.pause();
          chantAudio.currentTime = 0;
          chantAudio.muted = true;
        }
        if (bowlAudio) {
          bowlAudio.pause();
          bowlAudio.currentTime = 0;
        }
        bowHands.classList.remove("active");
        guanyinScrollButton.classList.remove("worship-focus");
        clearTimeout(chantRestoreTimer);
        clearTimeout(bowHideTimer);
        bowlDuckingActive = false;
        deityWorshipActive = false;
        bowMotionDone = false;
        bowHideTimeReached = false;
        chantSessionActive = false;
        chantWasInMainHall = false;
        chantRetryPending = false;
      }

      function startTitleAudio() {
        const bamboo = document.getElementById("titleBambooAudio");
        const returning = document.getElementById("titleReturnAudio");
        if (!bamboo || !returning) return;
        const active = hasLeftTitle ? returning : bamboo;
        const inactive = hasLeftTitle ? bamboo : returning;
        inactive.pause();
        inactive.currentTime = 0;
        if (active.paused) {
          active.volume = 0;
        }
        active.play().catch(() => {});
        fadeAudio(active, hasLeftTitle ? 0.44 : 0.52, 1200, "title");
      }

      function stopTitleAudio() {
        const bamboo = document.getElementById("titleBambooAudio");
        const returning = document.getElementById("titleReturnAudio");
        [bamboo, returning].forEach((audio) => {
          if (!audio) return;
          if (!audio.paused) {
            fadeAudio(audio, 0, 1500, "title", true);
          } else {
            audio.currentTime = 0;
          }
        });
      }

      function fadeAudio(audio, targetVolume, duration, group, pauseAtEnd = false) {
        const frameKey = group === "title"
          ? "titleAudioFadeFrame"
          : group === "chant"
            ? "chantAudioFadeFrame"
            : "bgAudioFadeFrame";
        const currentFrame = frameKey === "titleAudioFadeFrame"
          ? titleAudioFadeFrame
          : frameKey === "chantAudioFadeFrame"
            ? chantAudioFadeFrame
            : bgAudioFadeFrame;
        cancelAnimationFrame(currentFrame);
        const startVolume = audio.volume;
        const start = performance.now();

        function tick(now) {
          const progress = Math.min(1, (now - start) / duration);
          const eased = progress < 0.5
            ? 2 * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          audio.volume = startVolume + (targetVolume - startVolume) * eased;
          if (progress < 1) {
            const frame = requestAnimationFrame(tick);
            if (frameKey === "titleAudioFadeFrame") titleAudioFadeFrame = frame;
            else if (frameKey === "chantAudioFadeFrame") chantAudioFadeFrame = frame;
            else bgAudioFadeFrame = frame;
            return;
          }
          audio.volume = targetVolume;
          if (pauseAtEnd) {
            audio.pause();
            audio.currentTime = 0;
          }
        }

        const frame = requestAnimationFrame(tick);
        if (frameKey === "titleAudioFadeFrame") titleAudioFadeFrame = frame;
        else if (frameKey === "chantAudioFadeFrame") chantAudioFadeFrame = frame;
        else bgAudioFadeFrame = frame;
      }

      function updateChantAudio() {
        const audio = document.getElementById("chantAudio");
        if (!audio) return;
        const isInMainHall = currentSceneId === "mainHall";
        const justEnteredMainHall = isInMainHall && !chantWasInMainHall;

        if (isInMainHall) {
          setChantMode("inside");
          audio.muted = false;
          if (justEnteredMainHall && !chantSessionActive) {
            audio.currentTime = 0;
            playChantAudio(true);
          }
          chantWasInMainHall = true;
          return;
        }

        if (chantSessionActive && !audio.ended) {
          audio.muted = false;
          setChantMode(currentSceneId === "gate" ? "far" : "outside");
          playChantAudio();
        }
        chantWasInMainHall = false;
      }

      function setChantMode(mode) {
        const audio = document.getElementById("chantAudio");
        if (!audio) return;
        if (bowlDuckingActive) return;
        audio.volume = mode === "inside" ? 0.55 : mode === "far" ? 0.055 : 0.165;
      }

      function playChantAudio(markSession) {
        const audio = document.getElementById("chantAudio");
        if (!audio) return;
        audio.muted = false;
        const playPromise = audio.play();
        if (playPromise) {
          playPromise.then(() => {
            if (markSession) chantSessionActive = true;
            chantRetryPending = false;
          }).catch(() => {
            chantRetryPending = true;
          });
        } else if (markSession) {
          chantSessionActive = true;
        }
      }

      function unlockChantAudio() {
        if (chantUnlocked) return;
        const audio = document.getElementById("chantAudio");
        if (!audio) return;
        const previousVolume = audio.volume;
        audio.volume = 0;
        audio.muted = true;
        audio.play().then(() => {
          if (!chantSessionActive) {
            audio.pause();
            audio.currentTime = 0;
          }
          audio.muted = false;
          audio.volume = previousVolume || 0.55;
          chantUnlocked = true;
        }).catch(() => {
          audio.muted = false;
          audio.volume = previousVolume || 0.55;
        });
      }

      document.getElementById("chantAudio").addEventListener("ended", () => {
        chantSessionActive = false;
      });

      window.addEventListener("pointerdown", () => {
        updateAllAudio();
      }, { once: true });

      window.addEventListener("pointerdown", () => {
        if (chantRetryPending && currentSceneId === "mainHall") {
          playChantAudio(true);
        }
      });

      function classifyWish(value) {
        const wish = value.toLowerCase();
        if (/money|wealth|job|career|business|fortune|财|事业|工作|中奖/.test(wish)) return "finance";
        if (/health|safe|body|ill|平安|健康/.test(wish)) return "health";
        if (/love|marry|relationship|脱单|姻缘|感情|喜欢/.test(wish)) return "love";
        if (/study|exam|school|learn|学|考试|文昌/.test(wish)) return "study";
        if (/mother|father|parent|home|family|家人|父母|家庭/.test(wish)) return "family";
        return "default";
      }

      const wishLabels = {
        finance: "财运",
        health: "康宁",
        love: "姻缘",
        study: "学业",
        family: "家宅",
        default: "未明"
      };

      function performRitual(ritual) {
        if (ritual === "coin") {
          const hit = Math.random() > 0.42;
          bless(
            hit ? "铜钱击中钟心。" : "铜钱落入暗水。",
            hit ? "清脆钟声穿过前庭，一道吉兆记入册中。" : "水纹散开，没有明确回应。庙接受了这一次尝试。",
            hit ? "吉兆" : "无明兆",
            hit ? 8 : 3
          );
        }
        if (ritual === "incense") {
          bless("三缕香烟并肩升起。", "主殿渐渐转暖，神像肩上的尘灰轻轻浮动。", "供奉已受", 7);
        }
        if (ritual === "blocks") {
          if (moonBlockBusy) return;
          const results = [
            {
              sign: "阴杯",
              text: "双杯皆覆，此路暂止；宜退一步，另择时机。",
              gain: 0,
              image: "assets/moon-result-yin.png"
            },
            {
              sign: "圣杯",
              text: "一仰一覆，神意已允；可行，但须守正。",
              gain: 0,
              image: "assets/moon-result-sheng.png"
            },
            {
              sign: "笑杯",
              text: "双杯皆开，神意含笑未定；此问尚需再明。",
              gain: 0,
              image: "assets/moon-result-xiao.png"
            }
          ];
          const result = results[Math.floor(Math.random() * results.length)];
          showMoonBlockResult(result);
          bless(`圣杯：${result.sign}`, result.text, result.sign, result.gain);
        }
      }

      function showMoonBlockResult(result) {
        if (moonBlockBusy) return;
        moonBlockBusy = true;
        clearTimeout(moonResultTimer);
        moonResultSign.textContent = result.sign;
        moonResultImage.src = result.image;
        moonResultImage.alt = result.sign;
        moonResultText.textContent = `${result.sign}：${result.text}`;
        moonResultPanel.classList.remove("active");
        void moonResultPanel.offsetWidth;
        moonResultPanel.classList.add("active");
        moonResultTimer = window.setTimeout(() => {
          moonResultPanel.classList.remove("active");
          moonBlockBusy = false;
        }, 4800);
      }

      function upgradeGuanyin() {
        if (currentSceneId !== "mainHall") return;
        if (statue >= 4) {
          typePrompt("观音像已臻圆满。", "卷轴金光微收，供奉已至第四级。");
          return;
        }
        const nextLevel = statue + 1;
        const cost = guanyinCosts[nextLevel];
        if (fate < cost) {
          typePrompt("福缘未足。", `供奉${nextLevel}级观音像需${cost}福缘，当前福缘为${fate}。`);
          return;
        }
        fate -= cost;
        statue = nextLevel;
        updateFuyuanUI();
        bless(`观音像升至${statue}级。`, "卷轴垂在主殿壁上，云纹与灯色一同亮起。", `观音${statue}级`, 0);
      }

      document.getElementById("backScene").addEventListener("click", goBack);

      document.getElementById("journalToggle").addEventListener("click", () => {
        journal.hidden = !journal.hidden;
      });

      incenseBurnerProp.addEventListener("click", () => {
        if (currentSceneId === "courtyard") {
          goToScene("incenseBurnerClose");
        }
      });

      guanyinScrollButton.addEventListener("click", upgradeGuanyin);

      worshipButton.addEventListener("click", () => {
        if (currentSceneId !== "incenseBurnerClose") return;
        worshipButton.disabled = true;
        worshipButton.classList.remove("visible");
        offeringHands.classList.remove("active");
        void offeringHands.offsetWidth;
        offeringHands.classList.add("active");
      });

      offeringHands.addEventListener("animationend", () => {
        offeringHands.classList.remove("active");
        addPlacedIncense();
        addFate(10);
        worshipButton.disabled = false;
        renderScene();
      });

      deityWorshipButton.addEventListener("click", () => {
        if (currentSceneId !== "mainHall" || deityWorshipActive) return;
        deityWorshipActive = true;
        bowMotionDone = false;
        bowHideTimeReached = false;
        clearTimeout(bowHideTimer);
        deityWorshipButton.disabled = true;
        deityWorshipButton.classList.remove("visible");
        guanyinScrollButton.classList.add("worship-focus");
        bowHands.classList.remove("active");
        void bowHands.offsetWidth;
        bowHands.classList.add("active");
        playSingingBowlRitual();
      });

      bowHands.addEventListener("animationend", () => {
        bowMotionDone = true;
        finishDeityWorshipIfReady();
      });

      function playSingingBowlRitual() {
        const bowl = document.getElementById("singingBowlAudio");
        const chant = document.getElementById("chantAudio");
        clearTimeout(chantRestoreTimer);
        bowlDuckingActive = true;
        if (chant && !chant.paused && chantSessionActive) {
          chant.muted = false;
          fadeAudio(chant, 0, 900, "chant");
        }
        if (!bowl) return;
        bowl.currentTime = 0;
        bowl.volume = 0.78;
        const playPromise = bowl.play();
        if (Number.isFinite(bowl.duration) && bowl.duration > 0) {
          scheduleBowHideBeforeBowlEnd(bowl);
        } else {
          bowl.addEventListener("loadedmetadata", () => scheduleBowHideBeforeBowlEnd(bowl), { once: true });
        }
        playPromise.catch(() => {
          bowHideTimeReached = true;
          finishDeityWorshipIfReady();
          scheduleChantRestore();
        });
      }

      document.getElementById("singingBowlAudio").addEventListener("ended", () => {
        bowHideTimeReached = true;
        finishDeityWorshipIfReady();
        scheduleChantRestore();
      });

      function scheduleBowHideBeforeBowlEnd(bowl) {
        clearTimeout(bowHideTimer);
        const remainingMs = Math.max(0, (bowl.duration - bowl.currentTime - 10) * 1000);
        bowHideTimer = window.setTimeout(() => {
          bowHideTimeReached = true;
          finishDeityWorshipIfReady();
        }, remainingMs);
      }

      function finishDeityWorshipIfReady() {
        if (!deityWorshipActive || !bowMotionDone || !bowHideTimeReached) return;
        bowHands.classList.remove("active");
        guanyinScrollButton.classList.remove("worship-focus");
        deityWorshipActive = false;
        addFate(10);
        renderScene();
      }

      function scheduleChantRestore() {
        clearTimeout(chantRestoreTimer);
        chantRestoreTimer = window.setTimeout(() => {
          bowlDuckingActive = false;
          const chant = document.getElementById("chantAudio");
          if (chant && currentSceneId === "mainHall" && chantSessionActive) {
            chant.muted = false;
            playChantAudio();
            fadeAudio(chant, 0.55, 1400, "chant");
          }
        }, 5000);
      }

      function addPlacedIncense() {
        const incense = document.createElement("div");
        incense.className = "placed-incense visible";
        const clip = document.createElement("div");
        clip.className = "incense-clip";
        const image = document.createElement("img");
        image.className = "incense-stick-image";
        image.src = "assets/incense-sticks.png";
        image.alt = "";
        const flames = ["left", "center", "right"].map((position) => {
          const flame = document.createElement("span");
          flame.className = `incense-flame ${position}`;
          return flame;
        });
        clip.append(image);
        incense.append(clip, ...flames);
        const offsets = [0, -34, 34, -68, 68, -102, 102];
        const offset = offsets[incenseCount % offsets.length];
        const row = Math.floor(incenseCount / offsets.length);
        incense.style.transform = `translateX(calc(-50% + ${offset}px)) translateY(${row * -10}px)`;
        incense.style.opacity = Math.max(0.54, 1 - row * 0.12);
        placedIncenseLayer.append(incense);
        const fullHeight = incense.getBoundingClientRect().height || 155;
        burningIncense.push({
          el: incense,
          clip,
          flames,
          fullHeight,
          start: performance.now(),
          duration: incenseBurnDuration,
          nextSmoke: performance.now() + 450
        });
        spawnSmokeWisp(burningIncense[burningIncense.length - 1]);
        incenseCount += 1;
        startIncenseBurnLoop();
      }

      function startIncenseBurnLoop() {
        if (incenseBurnLoopStarted) return;
        incenseBurnLoopStarted = true;
        requestAnimationFrame(updateBurningIncense);
      }

      function updateBurningIncense(now) {
        for (let index = burningIncense.length - 1; index >= 0; index -= 1) {
          const item = burningIncense[index];
          const progress = Math.min(1, (now - item.start) / item.duration);
          const remaining = 1 - progress;
          item.el.style.height = `${item.fullHeight * remaining}px`;
          item.flames.forEach((flame) => {
            flame.style.opacity = remaining > 0.03 ? "1" : "0";
          });

          if (progress >= 1) {
            item.el.remove();
            burningIncense.splice(index, 1);
            continue;
          }

          if (now >= item.nextSmoke && (currentSceneId === "incenseBurnerClose" || currentSceneId === "courtyard")) {
            spawnSmokeWisp(item, remaining);
            item.nextSmoke = now + randomSmokeDelay();
          }
        }

        if (burningIncense.length > 0) {
          requestAnimationFrame(updateBurningIncense);
        } else {
          incenseBurnLoopStarted = false;
        }
      }

      function randomSmokeDelay() {
        return 700 + Math.random() * 2400;
      }

      function spawnSmokeWisp(item, remainingOverride) {
        const count = 1 + Math.floor(Math.random() * 2);
        const origins = [63, 78, 93];
        const incenseRect = item.el.getBoundingClientRect();
        const gameRect = document.querySelector(".game").getBoundingClientRect();
        const remaining = typeof remainingOverride === "number"
          ? remainingOverride
          : Math.max(0, Math.min(1, incenseRect.height / item.fullHeight));
        for (let i = 0; i < count; i += 1) {
          const wisp = document.createElement("span");
          wisp.className = "smoke-wisp";
          const origin = origins[Math.floor(Math.random() * origins.length)] + (-2 + Math.random() * 4);
          const x = incenseRect.left - gameRect.left + incenseRect.width * (origin / 100);
          const y = incenseRect.bottom - gameRect.top - item.fullHeight * remaining - 10;
          wisp.style.setProperty("--x", `${x}px`);
          wisp.style.setProperty("--y", `${y}px`);
          wisp.style.animationDelay = `${i * 130}ms`;
          incenseSmokeLayer.append(wisp);
          window.setTimeout(() => wisp.remove(), 5000);
        }
      }

      document.getElementById("wishForm")?.addEventListener("submit", (event) => {
        event.preventDefault();
        const type = classifyWish(wishInput.value.trim());
        wishType.textContent = wishLabels[type];
        bless("香烟写下回应。", omens[type], "愿已入册", 9);
        wishInput.value = "";
      });

      document.querySelectorAll("[data-ritual]").forEach((button) => {
        button.addEventListener("click", () => {
          performRitual(button.dataset.ritual);
        });
      });

      renderScene();
    </script>
  </body>
</html>
