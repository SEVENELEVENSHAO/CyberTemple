<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="Two moon blocks painted in gongbi style">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c68a50"/>
      <stop offset=".48" stop-color="#7f4d31"/>
      <stop offset="1" stop-color="#3a251a"/>
    </linearGradient>
    <linearGradient id="redWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45d32"/>
      <stop offset=".54" stop-color="#7e351f"/>
      <stop offset="1" stop-color="#241611"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="10" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".38"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="paperEdge">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>
  <ellipse cx="180" cy="143" rx="142" ry="22" fill="#241611" opacity=".34"/>
  <g filter="url(#softShadow)">
    <path d="M84 53c34-32 98-26 121 12 18 30 9 67-24 87-37 23-91 10-112-26-15-26-12-52 15-73z" fill="url(#redWood)" filter="url(#paperEdge)"/>
    <path d="M88 59c31-25 83-19 101 11 15 24 7 53-20 69-31 18-75 8-92-20-12-20-8-41 11-60z" fill="none" stroke="#ddb77a" stroke-opacity=".52" stroke-width="3"/>
    <path d="M112 65c35-12 61-5 77 20M92 91c27 10 57 17 91 21M121 131c24-3 45-11 64-26" fill="none" stroke="#321d14" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M111 53c24-9 59-3 78 18" fill="none" stroke="#f0cf93" stroke-opacity=".36" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g filter="url(#softShadow)">
    <path d="M185 67c17-43 78-63 116-39 31 20 39 58 18 91-23 37-78 51-114 27-27-18-35-47-20-79z" fill="url(#wood)" filter="url(#paperEdge)"/>
    <path d="M195 67c17-34 65-49 94-31 25 15 30 45 13 71-19 29-62 41-91 23-21-14-27-38-16-63z" fill="none" stroke="#e4c38c" stroke-opacity=".58" stroke-width="3"/>
    <path d="M217 68c27-24 58-31 83-20M197 98c29-2 61-10 96-24M226 133c20-13 36-30 48-52" fill="none" stroke="#2b1a13" stroke-opacity=".56" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M209 67c18-20 51-33 80-22" fill="none" stroke="#f4d8a1" stroke-opacity=".34" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#251711" stroke-opacity=".48" stroke-width="1.4">
    <path d="M70 155c64 13 140 12 220-3"/>
    <path d="M95 166c50 8 105 7 168-2"/>
  </g>
</svg>
